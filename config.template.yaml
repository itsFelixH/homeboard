# ============================================================
# Homeboard Configuration
# ============================================================
# Copy this file to config.local.yaml and fill in your values.
#
#   cp config.template.yaml config.local.yaml
#
# Everything lives under `cards:`. The order of cards determines
# their display order. Set enabled: false to hide a card.
# ============================================================

# Your location (required — used for weather, rain, UV, AQI, pollen, commute)
location:
  latitude: 0
  longitude: 0
  # address: 'Your Street 1, 12345 City'  # home address (used to filter commute, shown in calendar)

# Your name (shown in greeting)
greeting:
  name: ''

# Cards — order = display order. All settings for a card go here.
cards:

  weather:
    enabled: true
    # units: celsius        # 'celsius' or 'fahrenheit'
    # refreshMinutes: 15
    # showClothing: true    # clothing suggestion based on apparent temp
    # showForecast: true    # 4-day forecast row
    # forecastDays: 4       # 1-7

  rain:
    enabled: true
    # refreshMinutes: 15
    # forecastHours: 12     # hours ahead to show (1-24)

  departures:
    enabled: true
    hafasAccessId: ''       # VBB HAFAS API key (free at vbb.de, optional)
    stops: []
    # refreshSeconds: 30
    # durationMinutes: 30
    # maxResults: 5
    #
    # stops:
    #   - id: '900024203'
    #     label: S Savignyplatz
    #     splitView: true
    #     splitLabels: ['Stadtmitte ←', 'Westkreuz →']
    #     splitKeywords: ['Spandau', 'Westkreuz']
    #     products:
    #       suburban: true

  commute:
    enabled: true
    destinations: []
    # refreshMinutes: 10
    # showBike: true
    # showTransit: true
    # targetArrivalToday: '09:30'       # latest morning arrival time for current day (before 09:30)
    # targetDepartureNextDay: '06:00'   # earliest morning departure time for next day (after 09:30)
    # skipWeekends: true                # target Monday morning when viewing on Fri afternoon or weekends
    # bikeSpeedFactor: 1.5  # multiply OSRM time (1.0=fast, 1.5=realistic)
    # origin:               # defaults to location above if not set
    #   latitude: 0
    #   longitude: 0
    #
    # destinations:
    #   - label: Office
    #     latitude: 52.50
    #     longitude: 13.40

  aqi:
    enabled: true
    # refreshMinutes: 30

  uv:
    enabled: true
    # refreshMinutes: 30

  pollen:
    enabled: true
    # refreshMinutes: 60
    # types: []             # e.g. ['grass', 'birch'] — empty = auto-detect

  plants:
    enabled: true
    # warningDays: 7        # show warning after this many days

  calendar:
    enabled: true
    icsUrl: ''              # Google Calendar "Secret address in iCal format"
    # maxEvents: 5
    # refreshMinutes: 30
    # showTomorrow: true
    # showCommute: true     # bike/transit time for events with locations
    # bufferMinutes: 5      # default pre-event buffer time (minutes)
    #
    # Modal Options (Event Detail Popup)
    # showNavigation: true   # show Google Maps & transit navigation buttons
    # showDescription: true  # show event description notes and links
    # showCategoryTag: true  # show category pill badge in modal
    # chainedRouteGapMinutes: 210 # max gap in minutes to route from previous event instead of home (default: 210 = 3.5h)
    # showCategories: true  # show category badges & colored accent stripes
    # hidePatterns: []      # regex patterns to filter events
    #
    # Custom Category Tags & Icons (customizable categories, icons, and colors)
    # categories:
    #   fitness:
    #     label: Fitness
    #     icon: '🏋️'
    #     color: Tangerine     # Google color name or hex (#f4511e)
    #     match: ['ride.bln', 'gym', 'workout', 'boulder', 'spinning', 'yoga', 'sport']
    #   work:
    #     label: Work
    #     icon: '💼'
    #     color: Peacock       # #039be5
    #     match: ['digitalcampus', 'sync', 'standup', 'meeting', 'sprint', '1:1', 'review', 'db systel']
    #   gaming:
    #     label: Gaming
    #     icon: '🎮'
    #     color: Grape         # #8e24aa
    #     match: ['lan', 'raid', 'game night', 'dnd']
    # categoryColors:       # custom colors for categories/keywords or Google color names (e.g. Tomato, Flamingo, Peacock)
    #   sport: Tangerine
    #   work: Peacock
    #   arzt: Basil
    #
    # Custom location rules for commute options & route preferences
    # places:
    #   - match: ['ride.bln', 'ride bln', 'Lietzenburger']                  # match keyword/substring or regex in event location or summary
    #     modes: ['walk', 'bike']            # allowed modes: ['walk', 'bike', 'transit'] (omit 'transit' to skip ÖPNV)
    #     preferredMode: 'bike'              # preferred mode for leave countdown: 'bike', 'walk', or 'transit'
    #   - match: 'Digitalcampus'
    #     modes: ['transit', 'bike']
    #     preferredLines: ['S3', 'S5', 'S7'] # picks trip featuring preferred ÖPNV line(s)
    #     preferredTransitVia: 'Ostkreuz'    # optional transfer/via stop preference
    #     latitude: 52.5025                  # optional: exact destination coords (skips geocoding)
    #     longitude: 13.4753
  birthdays:
    enabled: true
    icsUrl: ''              # Separate ICS calendar for birthdays
    # refreshMinutes: 60
    # lookaheadDays: 14     # days ahead to display upcoming birthdays (default: 14)
    # milestones: [18, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100] # ages highlighted as milestone jubilees
    # whatsappTemplate: 'Liebe/r {name}, alles Liebe und Gute zum Geburtstag! Ich wünsche dir ein fantastisches neues Lebensjahr, viel Gesundheit und Glück! 🎂🎉'
    #
    # Modal Options (Birthday Detail Popup)
    # showZodiac: true       # show Western Zodiac sign (e.g. ♎ Waage)
    # showCityWeather: true  # show live weather for contact's residential city
    # actions: ['whatsapp', 'instagram', 'contacts', 'call'] # quick action buttons to display
    # labels:               # Category badges per contact name
    #   'Max Mustermann': ['👨‍👩‍👧 Familie', '📍 Berlin']
    #   'Sarah Becker': ['💼 Arbeit', '💃 Sport']
    # cities:               # Residential city per contact (for location tag & local context)
    #   'Sarah Becker': 'München'

  countdown:
    enabled: true
    # maxVacations: 3
    # keywords: ['Urlaub', 'Vacation', 'Reise', 'Trip', 'Holiday', 'Ferien'] # calendar keywords to detect vacations
    # date: ''              # manual fallback: 'YYYY-MM-DD'
    # label: Vacation
    # names:                # override display title: { 'YYYY-MM-DD': 'Barcelona Trip' }
    #   '2026-09-17': 'Barcelona Trip'
    # destinations:         # explicit destination overrides for live weather/currency/timezone
    #   '2026-09-17': 'Barcelona'
    #
    # Modal Options (Vacation & Trip Detail Popup)
    # showPackingList: true  # show interactive packing checklist
    # showWeather: true      # show destination weather forecast
    # showCurrency: true     # show local currency converter
    #
    # docs:                 # Google Docs / Sheets / Notion planning links per trip
    #   '2026-09-17': 'https://docs.google.com/document/d/your-trip-notes'
    # defaultPackingList:   # custom default checklist items template
    #   - 'Reisepass / Personalausweis'
    #   - 'Krankenversicherungskarte'
    #   - 'Ladekabel & Powerbank'
    #   - 'Kopfhörer'
    #   - 'Zahnbürste & Kulturbeutel'
    #   - 'Sonnencreme & Sonnenbrille'
    #   - 'Bequeme Schuhe'
    #   - 'Hausapotheke'


  news:
    enabled: true
    # refreshMinutes: 10
    # perPage: 5
    # cycleSeconds: 30
    # defaultCategory: homepage  # homepage, inland, ausland, wirtschaft, sport

  word:
    enabled: true

  spell:
    enabled: true
    # cycleSeconds: 60      # auto-rotate between HP content types

  history:
    enabled: true
    # minYear: 1500         # prefer events after this year

  trash:
    enabled: true
    icsUrl: ''              # '/data/Abfuhrkalender.ics' or remote URL
    # refreshHours: 6
    # previewDays: 7

  github:
    enabled: true
    username: ''
    # refreshMinutes: 30
    # maxEvents: 4

  xkcd:
    enabled: true

  packages:
    enabled: true
    # dhlApiKey: ''         # optional: DHL API key for live status
    # refreshMinutes: 30

  email:
    enabled: true
    clientId: ''            # Google Cloud OAuth2 Client ID
    clientSecret: ''        # Google Cloud OAuth2 Client Secret
    # refreshMinutes: 5
    # Setup: Google Cloud Console > APIs > Gmail API > Credentials > OAuth2 Client
    # Set redirect URI to: http://localhost:7070/auth/gmail/callback
    # Then click "Connect Gmail" on the dashboard to authorize

  slideshow:
    enabled: true
    # images: []            # empty = random placeholders
    # intervalSeconds: 30
