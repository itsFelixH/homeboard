# ============================================================
# Homeboard Configuration
# ============================================================
# Copy this file to config.local.yaml and fill in your values.
#
#   cp config.template.yaml config.local.yaml
#
# Everything lives under `cards:`. The order of cards determines
# their display order. Set enabled: false to hide a card.
# ============================================================

# Your location (required — used for weather, rain, UV, AQI, pollen, commute)
location:
  latitude: 0
  longitude: 0
  # address: 'Your Street 1, 12345 City'  # home address (used to filter commute, shown in calendar)

# Your name (shown in greeting)
greeting:
  name: ''

# Cards — order = display order. All settings for a card go here.
cards:

  weather:
    enabled: true
    # units: celsius        # 'celsius' or 'fahrenheit'
    # refreshMinutes: 15
    # showClothing: true    # clothing suggestion based on apparent temp
    # showForecast: true    # 4-day forecast row
    # forecastDays: 4       # 1-7

  rain:
    enabled: true
    # refreshMinutes: 15
    # forecastHours: 12     # hours ahead to show (1-24)

  departures:
    enabled: true
    hafasAccessId: ''       # VBB HAFAS API key (free at vbb.de, optional)
    stops: []
    # refreshSeconds: 30
    # durationMinutes: 30
    # maxResults: 5
    #
    # stops:
    #   - id: '900024203'
    #     label: S Savignyplatz
    #     splitView: true
    #     splitLabels: ['Stadtmitte ←', 'Westkreuz →']
    #     splitKeywords: ['Spandau', 'Westkreuz']
    #     products:
    #       suburban: true

  commute:
    enabled: true
    destinations: []
    # refreshMinutes: 10
    # showBike: true
    # showTransit: true
    # bikeSpeedFactor: 1.5  # multiply OSRM time (1.0=fast, 1.5=realistic)
    # origin:               # defaults to location above if not set
    #   latitude: 0
    #   longitude: 0
    #
    # destinations:
    #   - label: Office
    #     latitude: 52.50
    #     longitude: 13.40

  aqi:
    enabled: true
    # refreshMinutes: 30

  uv:
    enabled: true
    # refreshMinutes: 30

  pollen:
    enabled: true
    # refreshMinutes: 60
    # types: []             # e.g. ['grass', 'birch'] — empty = auto-detect

  plants:
    enabled: true
    # warningDays: 7        # show warning after this many days

  calendar:
    enabled: true
    icsUrl: ''              # Google Calendar "Secret address in iCal format"
    # maxEvents: 5
    # refreshMinutes: 30
    # showTomorrow: true
    # showCommute: true     # bike/transit time for events with locations
    # hidePatterns: []      # regex patterns to filter events

  birthdays:
    enabled: true
    icsUrl: ''              # Separate ICS calendar for birthdays
    # refreshMinutes: 60
    # lookaheadDays: 7

  countdown:
    enabled: true
    # maxVacations: 3
    # keyword: Urlaub       # calendar keyword to detect vacations
    # date: ''              # manual fallback: 'YYYY-MM-DD'
    # label: Vacation
    # names: {}             # { '2026-09-17': 'Barcelona' }

  news:
    enabled: true
    # refreshMinutes: 10
    # perPage: 5
    # cycleSeconds: 30
    # defaultCategory: homepage  # homepage, inland, ausland, wirtschaft, sport

  word:
    enabled: true

  spell:
    enabled: true
    # cycleSeconds: 60      # auto-rotate between HP content types

  history:
    enabled: true
    # minYear: 1500         # prefer events after this year

  trash:
    enabled: true
    icsUrl: ''              # '/data/Abfuhrkalender.ics' or remote URL
    # refreshHours: 6
    # previewDays: 7

  github:
    enabled: true
    username: ''
    # refreshMinutes: 30
    # maxEvents: 4

  xkcd:
    enabled: true

  packages:
    enabled: true
    # dhlApiKey: ''         # optional: DHL API key for live status
    # refreshMinutes: 30

  email:
    enabled: true
    clientId: ''            # Google Cloud OAuth2 Client ID
    clientSecret: ''        # Google Cloud OAuth2 Client Secret
    # refreshMinutes: 5
    # Setup: Google Cloud Console > APIs > Gmail API > Credentials > OAuth2 Client
    # Set redirect URI to: http://localhost:7070/auth/gmail/callback
    # Then click "Connect Gmail" on the dashboard to authorize

  slideshow:
    enabled: true
    # images: []            # empty = random placeholders
    # intervalSeconds: 30
