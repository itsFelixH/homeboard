# Nord theme — Arctic, north-bluish color palette
# Based on https://www.nordtheme.com/
name: Nord
icon: "❄️"

colors:
  bg: "#2e3440"
  surface: "#3b4252"
  surface-hover: "#434c5e"
  border: "#4c566a"
  text: "#eceff4"
  text-muted: "#d8dee9"
  text-faint: "#7b88a1"
  accent: "#88c0d0"
  accent-dim: "#88c0d020"
  highlight: "#88c0d0"
  ok: "#a3be8c"
  warning: "#ebcb8b"
  danger: "#bf616a"

style:
  font: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
  radius: "10px"
  spacing: "12px"
  shadow: "0 2px 8px rgba(0,0,0,0.25)"
  borders: false
  header-weight: "500"
  transitions: true
  glow: "none"
