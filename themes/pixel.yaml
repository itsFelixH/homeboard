# Pixel theme — retro 8-bit aesthetic
name: Pixel
icon: "👾"

colors:
  bg: "#0a0a1a"
  surface: "#111128"
  surface-hover: "#1a1a3a"
  border: "#2a2a4a"
  text: "#e0e8ff"
  text-muted: "#8888b0"
  text-faint: "#5555a0"
  accent: "#ff4488"
  accent-dim: "#ff448820"
  highlight: "#00ffc8"
  ok: "#00ffc8"
  warning: "#ffcc00"
  danger: "#ff4466"

style:
  font: "'Press Start 2P', monospace"
  radius: "0px"
  spacing: "8px"
  shadow: "4px 4px 0 var(--border)"
  borders: true
  header-weight: "400"
  transitions: false
  glow: "0 0 8px var(--highlight)"
