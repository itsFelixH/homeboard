# Dark theme (default) — low-light optimized for always-on displays
name: Dark
icon: "🌙"

colors:
  bg: "#09090b"
  surface: "#18181b"
  surface-hover: "#1f1f23"
  border: "#27272a"
  text: "#fafafa"
  text-muted: "#a1a1aa"
  text-faint: "#71717a"
  accent: "#a78bfa"
  accent-dim: "#a78bfa12"
  highlight: "#a78bfa"
  ok: "#a78bfa"
  warning: "#a78bfaaa"
  danger: "#f87171"

style:
  font: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
  radius: "14px"
  spacing: "12px"
  shadow: "none"
  borders: true
  header-weight: "600"
  transitions: true
  glow: "none"
